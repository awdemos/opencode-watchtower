[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "watchtower"
version = "2.0.0"
description = "Policy-driven audit and guard system for safe operations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
watchtower = "watchtower.cli:main"
watchtower-safe = "watchtower.safe_commands:main"
safe-rm = "watchtower.safe_commands:main"
safe-cp = "watchtower.safe_commands:main"
safe-mv = "watchtower.safe_commands:main"
safe-mkdir = "watchtower.safe_commands:main"
safe-touch = "watchtower.safe_commands:main"
safe-chown = "watchtower.safe_commands:main"
safe-chmod = "watchtower.safe_commands:main"
safe-ln = "watchtower.safe_commands:main"
ssh-ls = "watchtower.safe_commands:main"
ssh-cat = "watchtower.safe_commands:main"
ssh-ps = "watchtower.safe_commands:main"
kubectl-exec-read = "watchtower.safe_commands:main"
kubectl-get-yaml = "watchtower.safe_commands:main"
kubectl-logs = "watchtower.safe_commands:main"
rg-search = "watchtower.safe_commands:main"
jq-query = "watchtower.safe_commands:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["watchtower*"]
